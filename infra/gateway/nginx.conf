events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Upstream service definitions
    upstream server_service  { server server:3004; }
    upstream asset_service   { server asset:3001; }
    upstream metadata_service { server metadata:3002; }
    upstream usage_service   { server usage:3003; }
    upstream dashboard_ui    { server dashboard-ui:5173; }

    server {
        listen 80;

        # ── Dashboard UI ──────────────────────────────────────────────
        location / {
            proxy_pass http://dashboard_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ──  Service — Upload, CRUD, Versions ────────────────────
        location /api/v1/assets {
            proxy_pass http://asset_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 100m;
        }

        # ── Metadata Service — Tags, Search, Duplicates ───────────────
        location /api/v1/metadata {
            proxy_pass http://metadata_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Usage Service — Tracking + Analytics ──────────────────────
        location /api/v1/usage {
            proxy_pass http://usage_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/analytics {
            proxy_pass http://usage_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Server — Auth, Users, Collections, Stats ──────────────────
        location /api/v1/auth {
            proxy_pass http://server_service;
            proxy_set_header Host $host;
        }

        location /api/v1/users {
            proxy_pass http://server_service;
            proxy_set_header Host $host;
        }

        location /api/v1/collection {
            proxy_pass http://server_service;
            proxy_set_header Host $host;
        }

        location /api/v1/stats {
            proxy_pass http://server_service;
            proxy_set_header Host $host;
        }

        # ── Swagger Docs ──────────────────────────────────────────────
        location /api/docs {
            proxy_pass http://server_service;
            proxy_set_header Host $host;
        }

        # ── Health Check ──────────────────────────────────────────────
        location /api/v1/ {
            proxy_pass http://server_service;
            proxy_set_header Host $host;
        }
    }
}
