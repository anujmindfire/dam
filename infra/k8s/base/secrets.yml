apiVersion: v1
kind: ConfigMap
metadata:
  name: dam-config
  namespace: dam
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: dam
  DB_USERS: postgres
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_ACCESS_KEY: minioadmin
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  NODE_ENV: production
  SERVER_HOST: server
  MINIO_PUBLIC_URL: "http://minio.local:8080"
  SERVER_PORT: "3004"
  ASSETS_SERVICE_HOST: assets
  ASSETS_SERVICE_PORT: "3001"
  METADATA_SERVICE_HOST: metadata
  METADATA_SERVICE_PORT: "3002"
  USAGE_SERVICE_HOST: usage
  USAGE_SERVICE_PORT: "3003"
  WORKER_HOST: worker
  WORKER_PORT: "3005"
  CLIENT_URL: http://dam.local:8080
  APP_URL: http://dam.local:8080
  APP_DOMAIN: dam.local
