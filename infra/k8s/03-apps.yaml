apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: dam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: dam-server:latest # Replace with actual image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3004
        envFrom:
        - configMapRef:
            name: dam-config
        - secretRef:
            name: dam-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3004
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: dam
spec:
  selector:
    app: server
  ports:
  - protocol: TCP
    port: 3004
    targetPort: 3004
---
