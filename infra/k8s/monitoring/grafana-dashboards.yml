# Comprehensive Grafana Dashboards ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: monitoring
data:
  # Master Operations Control Dashboard
  dam-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "👑 KPI Summary Metrics",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              },
              "unit": "none"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [{ "expr": "count(container_cpu_usage_seconds_total{pod=~\"worker-.*\", id=~\"/kubepods.*\", namespace=\"dam\"})", "refId": "A" }],
          "title": "Worker Replicas Active",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [{ "expr": "sum(dam_worker_jobs_total{status=\"completed\"}) or vector(0)", "refId": "A" }],
          "title": "Total Processed Tasks",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 5 },
                  { "color": "red", "value": 10 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [{ "expr": "sum(dam_worker_jobs_processing) or vector(0)", "refId": "A" }],
          "title": "Active Queued Jobs",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["mean"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [{ "expr": "sum(rate(container_network_receive_packets_total{pod=~\"api-gateway-.*\"}[1m])) or vector(0)", "refId": "A" }],
          "title": "API Gateway Request Rate",
          "type": "stat"
        },
        {
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 6,
          "title": "⚡ Application Ingress & Network Performance",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "lineWidth": 2
              },
              "unit": "KBs"
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "id": 7,
          "options": {
            "legend": {
              "calcs": ["max", "mean", "last"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [{ "expr": "sum(rate(container_network_receive_bytes_total{interface=~\"eth0|bridge|veth.*\"}[1m])) by (pod) / 1024", "legendFormat": "{{pod}} Ingress", "refId": "A" }],
          "title": "Cluster Network Throughput (KB/s)",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 8,
          "title": "🐳 Resource Compute Analytics (cAdvisor)",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 12,
                "gradientMode": "opacity",
                "lineWidth": 2
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "id": 9,
          "options": {
            "legend": {
              "calcs": ["max", "mean", "last"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total{id=~\"/kubepods.*\", namespace=\"dam\"}[1m])) by (pod) * 100", "legendFormat": "{{pod}}", "refId": "A" }],
          "title": "Pod CPU Utilization (%)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "lineWidth": 2
              },
              "unit": "decimbytes"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "id": 10,
          "options": {
            "legend": {
              "calcs": ["max", "mean", "last"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [{ "expr": "sum(container_memory_usage_bytes{id=~\"/kubepods.*\", namespace=\"dam\"}) by (pod) / 1024 / 1024", "legendFormat": "{{pod}}", "refId": "A" }],
          "title": "Pod Memory Usage (MB)",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "id": 11,
          "title": "📬 Queue & Worker Deep-Dive",
          "type": "row"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "lineWidth": 2
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "id": 12,
          "options": {
            "legend": {
              "calcs": ["max", "mean", "last"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            { "expr": "sum(rate(dam_worker_jobs_total{status=\"completed\"}[1m]))", "legendFormat": "Jobs Completed Rate", "refId": "A" },
            { "expr": "sum(rate(dam_worker_jobs_total{status=\"failed\"}[1m]))", "legendFormat": "Jobs Failed Rate", "refId": "B" }
          ],
          "title": "Worker Media Processing Jobs Speed & Compliance (Rate/Sec)",
          "type": "timeseries"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["DAM", "Kubernetes", "Observability"],
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m"
        ]
      },
      "title": "DAM Master Operations Control Center",
      "uid": "dam-master",
      "version": 1
    }
