apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-ui
  namespace: dam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-ui
  template:
    metadata:
      labels:
        app: dashboard-ui
    spec:
      containers:
      - name: dashboard-ui
        image: dam-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
        env:
        - name: VITE_API_URL
          value: "http://api-gateway/api/v1"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-ui
  namespace: dam
spec:
  selector:
    app: dashboard-ui
  ports:
  - protocol: TCP
    port: 5173
    targetPort: 5173
