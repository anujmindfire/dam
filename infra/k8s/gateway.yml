apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: dam
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        include       mime.types;
        default_type  application/octet-stream;
        upstream server_service  { server server:3004; }
        upstream asset_service   { server assets:3001; }
        upstream metadata_service { server metadata:3002; }
        upstream usage_service   { server usage:3003; }
        upstream dashboard_ui    { server dashboard-ui:5173; }
        server {
            listen 80;
            location / {
                proxy_pass http://dashboard_ui;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_cache_bypass $http_upgrade;
                proxy_buffering off;
                proxy_read_timeout 300s;
                proxy_connect_timeout 300s;
                proxy_send_timeout 300s;
            }
            location /api/v1/assets {
                proxy_pass http://asset_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                client_max_body_size 100m;
            }
            location /api/v1/metadata {
                proxy_pass http://metadata_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
            location /api/v1/usage {
                proxy_pass http://usage_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
            location /api/v1/ {
                proxy_pass http://server_service;
                proxy_set_header Host $host;
            }
            location /minio/ {
                proxy_pass http://minio:9000/;
                proxy_set_header Host minio:9000;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                client_max_body_size 5000m;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: dam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: dam
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30000
