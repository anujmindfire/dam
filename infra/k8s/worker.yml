apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: dam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: dam-worker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3005
        env:
        - name: PORT
          value: "3005"
        envFrom:
        - configMapRef:
            name: dam-config
        - secretRef:
            name: dam-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3005
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3005
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: dam
spec:
  selector:
    app: worker
  ports:
  - protocol: TCP
    port: 3005
    targetPort: 3005
