apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s

labels:
  - pairs:
      environment: production

replicas:
  - name: assets
    count: 3
  - name: metadata
    count: 3
  - name: server
    count: 3
  - name: usage
    count: 3
  - name: worker
    count: 5
  - name: dashboard-ui
    count: 3

patches:
  - path: ingress-patch.yml
