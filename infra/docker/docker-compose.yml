services:
  # ─── INFRASTRUCTURE ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - dam_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABUID: "1000"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - dam_net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dam_net
    volumes:
      - minio_data:/data

  # ─── API GATEWAY ──────────────────────────────────────────────
  api-gateway:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - assets
      - metadata
      - usage
      - dashboard-ui
    networks:
      - dam_net

  # ─── FRONTEND ─────────────────────────────────────────────────
  dashboard-ui:
    build:
      context: ../../
      dockerfile: apps/dashboard/Dockerfile
    environment:
      - VITE_API_URL=http://localhost:3004/api/v1
    ports:
      - "5173:5173"
    networks:
      - dam_net
    volumes:
      - ../../apps/dashboard:/app/apps/dashboard
      - ../../packages/shared:/app/packages/shared
      - /app/apps/dashboard/node_modules
      - /app/packages/shared/node_modules
      - /app/node_modules

  # ─── SERVER (3000) — Auth, Users, Collections, Gateway ────────
  server:
    build:
      context: ../../
      dockerfile: apps/server/Dockerfile
    env_file:
      - ../../.env
    environment:
      - PORT=3004
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LOG_LEVEL=info
      - ASSETS_SERVICE_HOST=assets
      - METADATA_SERVICE_HOST=metadata
      - USAGE_SERVICE_HOST=usage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3004:3004"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dam_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3004/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── ASSET SERVICE (3001) — Upload, CRUD, MinIO, RabbitMQ ─────
  assets:
    build:
      context: ../../
      dockerfile: apps/assets/Dockerfile
    env_file:
      - ../../.env
    environment:
      - PORT=3001
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - dam_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── METADATA SERVICE (3002) — Tags, Search, Redis Cache ──────
  metadata:
    build:
      context: ../../
      dockerfile: apps/metadata/Dockerfile
    env_file:
      - ../../.env
    environment:
      - PORT=3002
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3002:3002"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dam_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3002/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── USAGE SERVICE (3003) — Usage Tracking + Analytics ────────
  usage:
    build:
      context: ../../
      dockerfile: apps/usage/Dockerfile
    env_file:
      - ../../.env
    environment:
      - PORT=3003
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dam_net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3003/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── WORKER SERVICE — Queue Consumer, Analysis, Flags ─────────
  worker:
    build:
      context: ../../
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ../../.env
    environment:
      - DB_HOST=host.docker.internal
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - dam_net
    ports:
      - "3005:3005"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3005/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  dam_net:
    driver: bridge

volumes:
  minio_data:
