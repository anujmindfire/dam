version: "3.8"

services:

  # ─── INFRASTRUCTURE ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - dam_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - dam_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "is_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dam_net
    volumes:
      - minio_data:/data

  # ─── API GATEWAY ──────────────────────────────────────────────
  api-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - asset
      - metadata
      - usage
      - dashboard-ui
    networks:
      - dam_net

  # ─── FRONTEND ─────────────────────────────────────────────────
  dashboard-ui:
    build:
      context: ../../
      dockerfile: apps/dashboard/Dockerfile
    environment:
      - VITE_API_URL=http://localhost:8080/api
    ports:
      - "5173:5173"
    networks:
      - dam_net

  # ─── SERVER (3000) — Auth, Users, Collections, Gateway ────────
  server:
    build:
      context: ../../
      dockerfile: apps/server/Dockerfile
    env_file:
      - ../../.env
    environment:
      - PORT=3000
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dam_net
    restart: unless-stopped

  # ─── ASSET SERVICE (3001) — Upload, CRUD, MinIO, RabbitMQ ─────
  asset:
    build:
      context: ../../
      dockerfile: apps/asset/Dockerfile
    env_file:
      - ../../.env
    environment:
      - PORT=3001
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - dam_net
    restart: unless-stopped

  # ─── METADATA SERVICE (3002) — Tags, Search, Redis Cache ──────
  metadata:
    build:
      context: ../../
      dockerfile: apps/metadata/Dockerfile
    env_file:
      - ../../.env
    environment:
      - PORT=3002
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3002:3002"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dam_net
    restart: unless-stopped

  # ─── USAGE SERVICE (3003) — Usage Tracking + Analytics ────────
  usage:
    build:
      context: ../../
      dockerfile: apps/usage/Dockerfile
    env_file:
      - ../../.env
    environment:
      - PORT=3003
      - DB_HOST=host.docker.internal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dam_net
    restart: unless-stopped

  # ─── WORKER SERVICE — Queue Consumer, Analysis, Flags ─────────
  worker:
    build:
      context: ../../
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ../../.env
    environment:
      - DB_HOST=host.docker.internal
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - dam_net
    restart: unless-stopped

networks:
  dam_net:
    driver: bridge

volumes:
  minio_data:
