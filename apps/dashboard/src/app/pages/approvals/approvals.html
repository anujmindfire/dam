<div class="space-y-8 animate-[fadeIn_0.5s_ease-out]">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h1 class="text-4xl font-bold text-[var(--text-color)] tracking-tight">Compliance Queue</h1>
      <p class="text-slate-500 font-medium mt-1">Review and approve assets pending verification.</p>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-6">
    <app-card *ngFor="let item of approvals" class="group bg-white overflow-hidden">
      <app-card-body class="p-0 flex flex-col md:flex-row items-stretch">
        <div class="w-full md:w-64 bg-slate-100 flex items-center justify-center border-r border-slate-50">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
        </div>
        <div class="flex-1 p-8 flex flex-col justify-between">
          <div>
            <div class="flex items-center gap-3 mb-2">
              <h3 class="text-xl font-bold text-[var(--text-color)]">{{ item.name }}</h3>
              <app-badge type="warning">Pending Review</app-badge>
            </div>
            <p class="text-sm text-slate-500 font-medium">Uploaded by <span class="text-indigo-600 font-bold">{{ item.user }}</span> · {{ item.time }}</p>
          </div>
          <div class="flex gap-3 mt-6">
            <app-button variant="success" class="flex-1 gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
              Approve Asset
            </app-button>
            <app-button variant="danger" class="flex-1 gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
              Reject Asset
            </app-button>
          </div>
        </div>
      </app-card-body>
    </app-card>
  </div>
</div>
