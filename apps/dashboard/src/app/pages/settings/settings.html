<div class="space-y-8 animate-[fadeIn_0.5s_ease-out]">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h1 class="text-4xl font-bold text-[var(--text-color)] tracking-tight">Operator Settings</h1>
      <p class="text-slate-500 font-medium mt-1">Configure your profile and system preferences.</p>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <app-card class="lg:col-span-2 bg-white">
      <app-card-header>
        <app-card-title>Profile Information</app-card-title>
      </app-card-header>
      <app-card-body class="p-8 space-y-6">
        <div class="flex flex-col md:flex-row gap-6">
          <div class="w-32 h-32 rounded-3xl bg-slate-100 border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-2 group cursor-pointer hover:border-[var(--primary)] hover:bg-indigo-50 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400 group-hover:text-[var(--primary)]"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <span class="text-[10px] font-bold text-slate-400 uppercase group-hover:text-[var(--primary)]">Avatar</span>
          </div>
          <div class="flex-1 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="space-y-1.5">
                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest ml-1">Full Name</label>
                <input type="text" value="System Operator" class="w-full h-11 px-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:border-[var(--primary)] focus:bg-white transition-all">
              </div>
              <div class="space-y-1.5">
                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest ml-1">Email Address</label>
                <input type="email" value="admin@dam.com" class="w-full h-11 px-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:border-[var(--primary)] focus:bg-white transition-all">
              </div>
            </div>
            <div class="space-y-1.5">
              <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest ml-1">Bio / Role Description</label>
              <textarea rows="3" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:border-[var(--primary)] focus:bg-white transition-all">Lead DAM Architect & Security Compliance Officer.</textarea>
            </div>
          </div>
        </div>
        <div class="flex justify-end pt-4">
          <app-button class="px-8 shadow-lg shadow-indigo-100">Update Profile</app-button>
        </div>
      </app-card-body>
    </app-card>

    <app-card class="bg-white">
      <app-card-header>
        <app-card-title>System Preferences</app-card-title>
      </app-card-header>
      <app-card-body class="p-8 space-y-6">
        <div *ngFor="let pref of [
          { label: 'Push Notifications', desc: 'Alerts for job completion' },
          { label: 'Auto-Ingest', desc: 'Sync files immediately' },
          { label: 'Dark Mode', desc: 'Experimental theme' }
        ]" class="flex items-center justify-between">
          <div>
            <p class="text-sm font-bold text-[var(--text-color)]">{{ pref.label }}</p>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">{{ pref.desc }}</p>
          </div>
          <div class="w-10 h-5 bg-slate-200 rounded-full relative cursor-pointer hover:bg-indigo-500 transition-all">
            <div class="absolute left-1 top-1 w-3 h-3 bg-white rounded-full"></div>
          </div>
        </div>
      </app-card-body>
    </app-card>
  </div>
</div>
