<div class="space-y-8 animate-[fadeIn_0.5s_ease-out]">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h1 class="text-4xl font-bold text-[var(--text-color)] tracking-tight">Library Hub</h1>
      <p class="text-slate-500 font-medium mt-1">Manage and organize your digital assets from a central vault.</p>
    </div>
    <app-button (onClick)="showUploadModal = true" class="gap-2 px-8">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      Upload Asset
    </app-button>
  </div>

  <app-list
    [columns]="columns"
    [rows]="assets"
    [count]="totalCount"
    [page]="page"
    [limit]="limit"
    [loading]="isLoading"
    (onSearch)="handleSearch($event)"
    (onPageChange)="handlePageChange($event)"
    (onLimitChange)="handleLimitChange($event)"
  >
    <ng-template #rowTemplate let-row let-columnId="columnId">
      <ng-container [ngSwitch]="columnId">
        <div *ngSwitchCase="'name'" class="flex items-center gap-4">
          <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-indigo-500 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          </div>
          <div class="flex flex-col min-w-0">
            <span class="font-bold text-[var(--text-color)] truncate max-w-[240px]">{{ row.name }}</span>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">ID: {{ row.id }}</span>
          </div>
        </div>

        <span *ngSwitchCase="'type'" class="px-3 py-1 bg-slate-100 rounded-full text-[10px] font-bold text-slate-500 uppercase tracking-wider">
          {{ row.mimeType }}
        </span>

        <app-badge *ngSwitchCase="'status'" [type]="row.status === 'approved' ? 'success' : 'warning'">
          {{ row.status }}
        </app-badge>

        <div *ngSwitchCase="'actions'" class="flex justify-end gap-2">
          <app-button variant="ghost" size="icon" (onClick)="viewDetail(row.id)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </app-button>
          <app-button variant="ghost" size="icon" (onClick)="addToCollection(row.id)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          </app-button>
        </div>

        <span *ngSwitchDefault>{{ row[columnId] }}</span>
      </ng-container>
    </ng-template>
  </app-list>
</div>

<app-upload-modal
  [isOpen]="showUploadModal"
  (onClose)="showUploadModal = false"
  (onSuccess)="handleUploadSuccess()"
></app-upload-modal>

<app-add-to-collection-modal
  [isOpen]="showCollectionModal"
  [collections]="mockCollections"
  (onClose)="showCollectionModal = false"
  (onSelect)="handleCollectionSelect($event)"
></app-add-to-collection-modal>
