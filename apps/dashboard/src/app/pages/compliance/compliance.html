<div class="space-y-8 animate-[fadeIn_0.5s_ease-out]">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h1 class="text-4xl font-bold text-[var(--text-color)] tracking-tight">Compliance Governance</h1>
      <p class="text-slate-500 font-medium mt-1">Monitor asset licensing, usage rights, and regulatory adherence.</p>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <app-card class="lg:col-span-2">
      <app-card-header>
        <app-card-title>Licensing Distribution</app-card-title>
      </app-card-header>
      <app-card-body class="p-8">
        <div class="space-y-6">
          <div *ngFor="let item of [
            { label: 'Public Domain', value: 45, color: 'bg-emerald-500' },
            { label: 'Internal Only', value: 30, color: 'bg-indigo-500' },
            { label: 'Third Party License', value: 15, color: 'bg-amber-500' },
            { label: 'Restricted', value: 10, color: 'bg-rose-500' }
          ]" class="space-y-2">
            <div class="flex justify-between text-[11px] font-bold uppercase tracking-widest">
              <span class="text-slate-500">{{ item.label }}</span>
              <span class="text-[var(--text-color)]">{{ item.value }}%</span>
            </div>
            <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
              <div [class]="item.color + ' h-full rounded-full'" [style.width.%]="item.value"></div>
            </div>
          </div>
        </div>
      </app-card-body>
    </app-card>

    <app-card>
      <app-card-header>
        <app-card-title>Regulatory Alerts</app-card-title>
      </app-card-header>
      <app-card-body class="p-8 space-y-4">
        <div *ngFor="let alert of [
          { type: 'danger', msg: '3 Assets Expiring in 48h' },
          { type: 'warning', msg: 'Missing Metadata on 12 Assets' },
          { type: 'info', msg: 'Audit Logs Synchronized' }
        ]" [class]="'p-4 rounded-xl border flex items-center gap-3 ' + (alert.type === 'danger' ? 'bg-rose-50 border-rose-100 text-rose-700' : alert.type === 'warning' ? 'bg-amber-50 border-amber-100 text-amber-700' : 'bg-indigo-50 border-indigo-100 text-indigo-700')">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span class="text-xs font-bold uppercase tracking-wide">{{ alert.msg }}</span>
        </div>
      </app-card-body>
    </app-card>
  </div>
</div>
