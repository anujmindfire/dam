<div class="space-y-8 animate-[fadeIn_0.5s_ease-out]">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h1 class="text-4xl font-bold text-[var(--text-color)] tracking-tight">Vault Collections</h1>
      <p class="text-slate-500 font-medium mt-1">Curated hubs for organizing and distributing related digital assets.</p>
    </div>
    <app-button class="gap-2 px-8">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
      New Collection
    </app-button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <app-card *ngFor="let col of collections" class="group hover:shadow-2xl hover:-translate-y-2 transition-all duration-500 bg-white">
      <app-card-body class="p-8">
        <div class="flex items-center justify-between mb-6">
          <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-[var(--primary)] flex items-center justify-center shadow-inner group-hover:bg-[var(--primary)] group-hover:text-white transition-all duration-500">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          </div>
          <app-badge type="info">{{ col.assetCount }} Assets</app-badge>
        </div>
        <h3 class="text-xl font-bold text-[var(--text-color)] group-hover:text-[var(--primary)] transition-colors">{{ col.name }}</h3>
        <p class="text-sm text-slate-400 font-medium mt-2 line-clamp-2">Centralized hub for all {{ col.name }} related marketing and brand assets.</p>
        <div class="mt-8 pt-6 border-t border-slate-50 flex items-center justify-between">
          <div class="flex -space-x-2">
            <div *ngFor="let i of [1,2,3]" class="w-8 h-8 rounded-full border-2 border-white bg-slate-100 flex items-center justify-center text-[10px] font-bold text-slate-400">
              {{ i }}
            </div>
          </div>
          <app-button variant="ghost" size="sm" class="text-indigo-600 font-bold uppercase tracking-widest text-[10px]">
            Open Vault
          </app-button>
        </div>
      </app-card-body>
    </app-card>
  </div>
</div>
