<div class="space-y-8 animate-in fade-in duration-500">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
    <div>
      <h1 class="text-3xl font-bold text-[var(--text-color)] tracking-tight italic">
        User Management
      </h1>
      <p class="text-slate-500 text-sm mt-1 font-medium">Control access and system roles</p>
    </div>
  </div>

  <app-list
    [columns]="columns"
    [rows]="users"
    [count]="totalCount"
    [page]="currentPage"
    [limit]="limit"
    [loading]="isLoading"
    (onSearch)="handleSearch($event)"
    (onPageChange)="handlePageChange($event)"
    (onLimitChange)="handleLimitChange($event)"
  >
    <ng-template #rowTemplate let-row let-columnId="columnId">
      <ng-container [ngSwitch]="columnId">
        <div *ngSwitchCase="'name'" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-indigo-50 flex items-center justify-center text-[var(--primary)] font-bold text-xs border border-indigo-100">
            {{ row.name?.charAt(0) || "U" }}
          </div>
          <span class="font-bold text-[var(--text-color)]">{{ row.name }}</span>
        </div>

        <span *ngSwitchCase="'email'" class="text-slate-500 font-medium">
          {{ row.email }}
        </span>

        <div *ngSwitchCase="'status'" class="flex items-center justify-center">
          <div
            class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider border"
            [ngClass]="row.roleId === 1 ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-slate-50 text-slate-500 border-slate-200'"
          >
            {{ row.roleId === 1 ? "Administrator" : "Standard User" }}
          </div>
        </div>

        <div *ngSwitchCase="'actions'" class="flex items-center justify-end gap-1">
          <app-button
            variant="ghost"
            size="icon"
            (onClick)="handleEditClick(row)"
            class="text-slate-400 hover:text-[var(--primary)]"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
          </app-button>
          <app-button
            variant="ghost"
            size="icon"
            (onClick)="handleDelete(row.id)"
            class="text-slate-400 hover:text-rose-500"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
          </app-button>
        </div>

        <span *ngSwitchDefault>{{ row[columnId] }}</span>
      </ng-container>
    </ng-template>
  </app-list>

  <div *ngIf="isEditModalOpen" class="fixed inset-0 z-[2000] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-in fade-in duration-200">
    <div class="w-full max-w-md bg-white rounded-3xl border border-slate-200 shadow-2xl overflow-hidden p-6 space-y-5">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-xl font-bold text-[var(--text-color)]">Edit User</h3>
        <app-button variant="ghost" (onClick)="isEditModalOpen = false" class="w-8 h-8 p-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </app-button>
      </div>
      <div class="space-y-6">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">
            Name <span class="text-red-500 ml-0.5">*</span>
          </label>
          <input
            type="text"
            class="w-full h-11 px-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium outline-none focus:border-[var(--primary)] focus:bg-white transition-all"
            [(ngModel)]="editName"
          />
        </div>
        <div class="flex gap-3 pt-2">
          <app-button variant="outline" class="flex-1" [fullWidth]="true" (onClick)="isEditModalOpen = false">
            Cancel
          </app-button>
          <app-button class="flex-1 shadow-lg shadow-indigo-100" [fullWidth]="true" (onClick)="handleUpdate()">
            Update
          </app-button>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-10 pt-10 text-center text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">
    Identity Engine v1.0.4 · DAM Identity
  </div>
</div>
