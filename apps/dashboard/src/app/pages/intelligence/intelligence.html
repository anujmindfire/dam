<div class="space-y-8 animate-[fadeIn_0.5s_ease-out]">
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h1 class="text-4xl font-bold text-[var(--text-color)] tracking-tight">AI Intelligence</h1>
      <p class="text-slate-500 font-medium mt-1">Advanced analytics and automated tagging insights.</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <app-card class="bg-white">
      <app-card-header>
        <app-card-title>Tag Distribution</app-card-title>
      </app-card-header>
      <app-card-body class="p-8">
        <div class="flex flex-wrap gap-2">
          <span *ngFor="let tag of [
            'Marketing', 'Outdoor', 'Person', 'Water', 'Landscape', 'Brand', 'Logo', 'Summer'
          ]" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg text-[10px] font-bold uppercase tracking-widest border border-indigo-100 hover:bg-indigo-500 hover:text-white transition-all cursor-default">
            {{ tag }}
          </span>
        </div>
      </app-card-body>
    </app-card>

    <app-card class="lg:col-span-2">
      <app-card-header>
        <app-card-title>Object Detection Trends</app-card-title>
      </app-card-header>
      <app-card-body class="p-8">
        <div class="h-[200px] flex items-end gap-2 pb-2">
          <div *ngFor="let h of [30, 50, 40, 70, 90, 60, 80, 45, 65, 55, 75, 85]" class="flex-1 bg-slate-100 rounded-t-lg transition-all hover:bg-[var(--primary)]" [style.height.%]="h"></div>
        </div>
        <div class="flex justify-between text-[9px] font-bold text-slate-400 uppercase tracking-widest pt-4 border-t border-slate-50">
          <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span>
        </div>
      </app-card-body>
    </app-card>
  </div>
</div>
