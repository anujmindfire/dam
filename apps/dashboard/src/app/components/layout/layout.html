<div class="flex h-screen w-full overflow-hidden bg-[var(--background)] relative">
  <app-toast-container></app-toast-container>
  <!-- Mobile Overlay -->
  <div
    *ngIf="isOpen"
    class="fixed inset-0 bg-black/40 z-20 lg:hidden animate-[fadeIn_0.2s_ease-out]"
    (click)="toggleSidebar()"
  ></div>

  <app-sidebar [isOpen]="isOpen" (onClose)="toggleSidebar()"></app-sidebar>

  <div class="flex flex-col flex-1 h-full overflow-hidden min-w-0">
    <app-header [collapsed]="!isOpen" (onMenuClick)="toggleSidebar()"></app-header>
    <main class="flex-1 overflow-y-auto p-4 md:p-6">
      <div class="mx-auto h-full">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
