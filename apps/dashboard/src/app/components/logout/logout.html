<div class="relative">
  <div
    class="flex h-8 w-8 items-center justify-center rounded-full bg-green-500 text-white font-semibold text-sm cursor-pointer shadow-sm hover:scale-105 transition-transform"
    (click)="toggleDropdown($event)"
  >
    {{ avatarInitial }}
  </div>

  <div *ngIf="isOpen" class="absolute right-0 top-10 w-48 rounded-md border border-gray-200 bg-white shadow-lg z-[200] animate-[fadeIn_0.2s_ease-out]">
    <div class="p-3 border-b border-gray-200">
      <div class="font-bold truncate text-sm text-gray-900">{{ user?.name }}</div>
      <div class="text-xs text-gray-500 truncate">{{ user?.email }}</div>
    </div>
    <div class="p-2">
      <button
        (click)="handleLogout()"
        [disabled]="isLoading"
        class="w-full rounded px-1.5 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 transition disabled:opacity-60 disabled:cursor-not-allowed"
      >
        {{ isLoading ? 'Logging out...' : 'Logout' }}
      </button>
    </div>
  </div>
</div>
