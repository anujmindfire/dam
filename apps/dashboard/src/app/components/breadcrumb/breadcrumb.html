<nav class="text-[var(--text-color)] flex items-center leading-none text-sm font-medium">
  <a routerLink="/" class="hover:text-[var(--primary)] transition-all flex items-center">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
  </a>
  <span *ngIf="parts.length > 0" class="mx-2 text-gray-400">/</span>
  <ng-container *ngFor="let part of parts; let i = index; let last = last">
    <span class="flex items-center">
      <ng-container *ngIf="last; else link">
        <span class="text-gray-500 font-semibold">{{ part.name }}</span>
      </ng-container>
      <ng-template #link>
        <a [routerLink]="part.url" class="hover:text-[var(--primary)] transition-colors">
          {{ part.name }}
        </a>
        <span class="mx-2 text-gray-400">/</span>
      </ng-template>
    </span>
  </ng-container>
</nav>
