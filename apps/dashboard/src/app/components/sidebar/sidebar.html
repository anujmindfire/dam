<aside
  [class.w-0]="!isOpen"
  [class.w-[var(--sidebar-width)]]="isOpen"
  class="fixed lg:relative z-30 h-full bg-white flex flex-col overflow-hidden transition-all duration-300 ease-in-out border-r border-[var(--border)]"
>
  <div class="flex items-center h-[var(--header-height)] px-6 gap-3">
    <a routerLink="/" class="flex items-center gap-2">
      <div class="w-8 h-8 bg-[var(--primary)] rounded-lg flex items-center justify-center shadow-lg shadow-indigo-200">
        <span class="text-white font-bold text-lg">D</span>
      </div>
      <span class="font-bold text-xl tracking-tight text-[var(--text-color)]">DAM</span>
    </a>

    <button
      (click)="onClose.emit()"
      class="ml-auto p-1.5 rounded-md hover:bg-gray-100 transition-colors lg:hidden"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </div>

  <nav class="p-4 flex-1 flex flex-col gap-1.5 overflow-y-auto">
    <ng-container *ngFor="let item of navItems">
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-indigo-50 text-[var(--primary)] font-semibold shadow-sm border border-indigo-100"
        [routerLinkActiveOptions]="item.path === '/' ? {exact: true} : {exact: false}"
        #rla="routerLinkActive"
        (click)="handleLinkClick()"
        class="flex items-center gap-3 px-4 py-2.5 rounded-lg transition-all duration-200 group text-gray-500 hover:bg-gray-50 hover:text-[var(--text-color)]"
      >
        <span class="w-[18px] h-[18px]" [innerHTML]="item.icon"></span>
        <span class="truncate text-sm">{{ item.name }}</span>
        <div *ngIf="rla.isActive" class="ml-auto w-1 h-4 bg-[var(--primary)] rounded-full"></div>
      </a>
    </ng-container>
  </nav>

  <div class="p-4 border-t border-[var(--border)]">
    <div class="bg-slate-50 rounded-xl p-3 flex items-center gap-3 border border-slate-100">
      <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-[var(--primary)] font-bold text-xs">
        {{ user?.name?.charAt(0) || 'U' }}
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-bold text-[var(--text-color)] truncate">{{ user?.name }}</p>
        <p class="text-[10px] text-gray-500 truncate uppercase tracking-wider">
          {{ user?.roleId === 1 ? 'Administrator' : 'User' }}
        </p>
      </div>
    </div>
  </div>
</aside>
