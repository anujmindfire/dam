<aside
  class="glass fixed left-5 top-5 flex flex-col p-6 z-[1000] transition-all duration-300 ease-in-out"
  style="width: var(--sidebar-width); height: calc(100vh - 40px);"
>
  <div class="flex items-center gap-3 mb-12 pl-2">
    <div
      class="w-9 h-9 rounded-[10px] flex items-center justify-center font-bold text-sm text-white"
      style="background: linear-gradient(135deg, var(--color-primary), var(--color-accent-purple)); shadow: 0 4px 12px var(--color-primary-glow);"
    >
      DAM
    </div>
    <span
      class="text-lg font-semibold tracking-tight"
      style="font-family: var(--font-heading); color: var(--color-text-main);"
    >
      Intelligence
    </span>
  </div>

  <nav class="flex flex-col gap-2 flex-1">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{exact: item.path === '/'}"
      class="nav-link flex items-center gap-3 py-3 px-4 no-underline rounded-xl transition-all duration-300 ease-in-out hover:bg-white/5 text-slate-400"
    >
      <span class="icon-placeholder opacity-70" [innerHTML]="item.icon"></span>
      <span>{{ item.name }}</span>
    </a>
  </nav>

  <div class="mt-auto pt-6" style="border-top: 1px solid var(--color-glass-border);">
    <div class="flex items-center gap-2 text-xs" style="color: var(--color-text-dim);">
      <div
        class="w-2 h-2 rounded-full bg-emerald-500"
        style="box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);"
      ></div>
      <span>System Healthy</span>
    </div>
  </div>
</aside>
